{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block answer_new %}

<section class="flex-header">
    <h1>New answer</h1>
    <a class="button header-button referrer" href="{% url 'tests' %}" aria-label="Return to the previous page">Back</a>
    <a class="button header-button" href="{% url 'tests' %}">Cancel</a>
</section>
<section class="submitted">
    <p class="submitted-test">{{ answer_new_test.test }}</p>
    <p class="submitted-question">{{ answer_new_question.question }}</p>
</section>
<form method="post" id="answerForm" class="form">
    {{ answer_new_answers | crispy }}
    {% csrf_token %}
    <button type="submit" id="answerSubmit" class="button mb-3">Submit</button>
</form>

{% endblock answer_new %}
