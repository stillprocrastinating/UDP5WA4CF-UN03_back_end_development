{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block answer_form %}

<section class="flex-header">
    <h1>{% if id %}Edit{% else %}New{% endif %} answer</h1>
    <a class="button form-cancel header-button referrer" href="{% url 'tests' %}" aria-label="Cancel and return to the previous page">Cancel</a>
</section>
<form method="post" id="answerForm" class="form">
    {{ answer_form | crispy }}
    {% csrf_token %}
    <button type="submit" id="answerSubmit" class="button form-form mb-3" aria-label="Submit the answer form" value="AnswerForm">Submit</button>
</form>

{% endblock answer_form %}
