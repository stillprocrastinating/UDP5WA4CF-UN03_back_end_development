{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block answer_form %}

<section class="flex-header">
    <h1>Delete answer</h1>
    <a class="button form-cancel header-button referrer" href="{% url 'tests' %}" aria-label="Cancel and return to the previous page">Cancel</a>
</section>
<form method="post" id="answerForm" class="center form">
    <p class="strong">Delete</p>
    <p>{{ object.question }}</p>
    <p>from</p>
    <p>{{ object.test }}?</p>
    {% csrf_token %}
    <button type="submit" id="answerDelete" class="button form-delete mb-3" aria-label="Submit the delete answer form" value="AnswerDelete">Confirm delete</button>
</form>

{% endblock answer_form %}
