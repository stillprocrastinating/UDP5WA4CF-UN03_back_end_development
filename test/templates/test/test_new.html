{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block test_new %}

<section class="flex-header">
    <h1>New test</h1>
    <a class="button form-cancel header-button referrer" href="{% url 'tests' %}" aria-label="Return to the previous page">Cancel</a>
</section>
<form method="post" id="testForm" class="form">
    {{ test_new | crispy }}
    {% csrf_token %}
    <button type="submit" id="testSubmit" class="button form-submit mb-3" aria-label="Submit the test form">Submit</button>
</form>

{% endblock test_new %}
